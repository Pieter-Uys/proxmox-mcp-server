name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported LTS lines; keep in step with engines.node in package.json.
        node-version: [22, 24, 26]
    steps:
      # Actions are pinned to commit SHAs: a tag can be moved to other code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      # Coverage floor, a little under the current level, so untested code
      # can't quietly grow. Raise it as coverage improves.
      - name: Coverage
        if: matrix.node-version == 22
        run: node --test --experimental-test-coverage --test-coverage-lines=85 --test-coverage-branches=85 --test-coverage-functions=75
      - run: npm audit --omit=dev --audit-level=high
        if: matrix.node-version == 22

  # The branch ruleset requires a check named "test". Matrix jobs report as
  # "node 22" and so on, so this job gives the ruleset one stable name that
  # passes only if every Node version passed.
  test:
    needs: node
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.node.result }}" = success
