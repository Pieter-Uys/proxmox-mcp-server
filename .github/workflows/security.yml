name: Security

# Adversarial regression suite: drives the real policy gate, command
# construction and JWT verification with attack inputs. It is the guard that
# catches a dependency bump or refactor quietly reopening a bypass. No network
# and no real Proxmox: every harness stands up its own instrumented mocks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, matching ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # openssl is present on ubuntu-latest; the rig uses it for a throwaway
      # self-signed cert for the mock Proxmox API.
      - run: node test/security/run-all.mjs
